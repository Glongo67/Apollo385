name: Build Apollo 3.8.5 Gallery Slideshow IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Clone Apollo Reborn 3.8.5
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --depth 20 \
            https://github.com/Apollo-Reborn/Apollo-Reborn.git \
            "$RUNNER_TEMP/Apollo-Reborn"
          cd "$RUNNER_TEMP/Apollo-Reborn"
          git checkout v1.15.11_3.8.5
          git submodule update --init --recursive --depth 1
          echo "Using Apollo Reborn commit: $(git rev-parse --short HEAD)"

      - name: Apply Gallery Slideshow patch
        shell: bash
        env:
          APOLLO_SLIDESHOW_PATCH_B64: ""
        run: |
          set -euo pipefail
          printf "%s" "$APOLLO_SLIDESHOW_PATCH_B64" | base64 --decode > "$RUNNER_TEMP/gallery-slideshow.patch"
          cd "$RUNNER_TEMP/Apollo-Reborn"
          git apply --check "$RUNNER_TEMP/gallery-slideshow.patch"
          git apply "$RUNNER_TEMP/gallery-slideshow.patch"
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos on runner
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.0.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app
          else
            XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -1)
            if [ -z "$XCODE_APP" ]; then
              echo "No Xcode 26 installation found on this GitHub runner."
              exit 1
            fi
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Build modified Apollo Reborn tweak
        working-directory: ${{ runner.temp }}/Apollo-Reborn
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1
          ls -lh packages/*.deb

      - name: Download prepared Apollo base IPA
        working-directory: ${{ runner.temp }}/Apollo-Reborn
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/Apollo-Reborn/Apollo-Reborn/releases/download/v1.15.11_3.8.5/Apollo-Reborn-3.8.5-GLASS-NOEXTENSIONS.ipa \
            -o Apollo.ipa
          unzip -t Apollo.ipa >/dev/null

      - name: Build Gallery Slideshow IPA
        working-directory: ${{ runner.temp }}/Apollo-Reborn
        shell: bash
        run: |
          set -euo pipefail
          DEB_PATH=$(ls -1t packages/*.deb | head -1)
          mkdir -p dist
          ./build-ipa.sh \
            --ipa ./Apollo.ipa \
            --deb "$DEB_PATH" \
            -o ./dist/Apollo-Reborn-3.8.5-GallerySlideshow.ipa
          unzip -t ./dist/Apollo-Reborn-3.8.5-GallerySlideshow.ipa >/dev/null
          ls -lh ./dist/Apollo-Reborn-3.8.5-GallerySlideshow.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-Reborn-3.8.5-GallerySlideshow
          path: ${{ runner.temp }}/Apollo-Reborn/dist/Apollo-Reborn-3.8.5-GallerySlideshow.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          echo "## Apollo Gallery Slideshow IPA built" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **Apollo-Reborn-3.8.5-GallerySlideshow** artifact below this workflow run." >> "$GITHUB_STEP_SUMMARY"
